name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-amd64:
    name: linux-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archive
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}" BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" make build
          package="model-loader_${GITHUB_REF_NAME}_linux_amd64"
          mkdir -p "dist/${package}"
          cp bin/model-loader README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          rm -rf "dist/${package}"
          cd dist
          sha256sum "${package}.tar.gz" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/model-loader_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "model-loader ${GITHUB_REF_NAME}"
